<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bungalow Draft Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f2ee; min-height: 100vh; }
  .header { background: white; border-bottom: 1px solid #e8e0d8; padding: 14px 24px; display: flex; align-items: center; gap: 10px; }
  .header-logo { font-size: 18px; color: #8B6F47; font-style: italic; font-weight: 600; }
  .header-sub { font-size: 14px; color: #999; }
  .header-status { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #666; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
  .dot.connected { background: #22c55e; }
  .refresh-btn { padding: 5px 12px; border: 1px solid #e0d8d0; border-radius: 7px; background: white; color: #8B6F47; font-size: 12px; cursor: pointer; font-weight: 500; }
  .refresh-btn:hover { background: #faf8f5; }
  .app { display: flex; height: calc(100vh - 53px); }
  .sidebar { width: 290px; background: white; border-right: 1px solid #e8e0d8; display: flex; flex-direction: column; flex-shrink: 0; }
  .email-list { flex: 1; overflow-y: auto; }
  .email-item { padding: 13px 16px; border-bottom: 1px solid #f0ebe4; cursor: pointer; transition: background 0.1s; }
  .email-item:hover { background: #faf8f5; }
  .email-item.active { background: #faf8f5; border-left: 3px solid #8B6F47; }
  .email-sender { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .email-subject { font-size: 12px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
  .email-preview { font-size: 11px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .unread-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #8B6F47; margin-right: 5px; vertical-align: middle; }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .main-content { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #bbb; gap: 12px; }
  .empty p { font-size: 14px; }
  .email-card { background: white; border: 1px solid #e8e0d8; border-radius: 12px; padding: 20px; }
  .email-from { font-size: 13px; font-weight: 600; color: #333; }
  .email-time { font-size: 12px; color: #aaa; }
  .email-subject-lg { font-size: 16px; font-weight: 600; color: #222; margin: 8px 0 12px; }
  .email-body { font-size: 13px; color: #555; line-height: 1.7; white-space: pre-wrap; max-height: 280px; overflow-y: auto; }
  .gen-btn { padding: 11px; background: #8B6F47; color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; width: 100%; }
  .gen-btn:hover { background: #7a6040; }
  .gen-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .draft-card { background: white; border: 1px solid #e8e0d8; border-radius: 12px; overflow: hidden; }
  .draft-top { background: #faf8f5; padding: 12px 16px; border-bottom: 1px solid #e8e0d8; display: flex; align-items: center; justify-content: space-between; }
  .draft-lbl { font-size: 12px; font-weight: 600; color: #8B6F47; }
  .draft-badge { background: #f0e8dc; color: #8B6F47; font-size: 11px; padding: 2px 8px; border-radius: 20px; margin-left: 6px; }
  .btn-row { display: flex; gap: 8px; }
  .sm-btn { padding: 5px 12px; border: 1px solid #e0d8d0; border-radius: 7px; background: white; color: #555; font-size: 12px; cursor: pointer; }
  .sm-btn:hover { background: #faf8f5; }
  .draft-text { padding: 18px; font-size: 13px; color: #333; line-height: 1.75; white-space: pre-wrap; outline: none; min-height: 160px; }
  .draft-text:focus { background: #fdfcfb; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 24px; right: 24px; background: #333; color: white; padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .err { color: #c0392b; font-size: 13px; padding: 12px; background: #fdf0f0; border-radius: 8px; }
  .loading-msg { padding: 20px 16px; font-size: 12px; color: #8B6F47; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="header-logo">Bungalow</div>
  <div class="header-sub">Draft Assistant</div>
  <div class="header-status">
    <span class="dot" id="dot"></span>
    <span id="statusLabel">Connecting...</span>
    <button class="refresh-btn" onclick="loadEmails()">↻ Refresh</button>
  </div>
</div>
<div class="app">
  <div class="sidebar">
    <div class="email-list" id="emailList">
      <div class="loading-msg">Loading inbox...</div>
    </div>
  </div>
  <div class="main">
    <div class="main-content" id="main">
      <div class="empty"><p>Select an email to generate a draft reply</p></div>
    </div>
  </div>
</div>
<div class="toast" id="toast">Copied!</div>

<script>
const SYSTEM_PROMPT = `You are an email assistant for Bungalow, a refined Indian restaurant in NYC by Chef Vikas Khanna. Draft professional, warm, and confident replies to guest emails.

KEY POLICIES:

RESERVATIONS: All reservations for parties under 8 must be made exclusively through Resy. Opens 20 days in advance at 11 AM EST, except Tuesdays. We do NOT take reservations via email for small parties.

WALK-INS: Guests are welcome to visit before 4:30 PM and we will do our best to accommodate walk-ins based on availability.

NO AVAILABILITY / SMALL PARTY EMAIL REQUESTS: Do not apologize excessively. Redirect confidently to Resy and mention the walk-in option before 4:30 PM.

LARGE PARTIES (8-18 guests): Prix fixe menu served family style. $25 per person non-refundable deposit applied to final bill. Must confirm headcount, menu selection, and payment to lock in. Invoice valid 48 hours. No strollers or high chairs, not recommended for children under 10.

OVER 18 GUESTS: Full restaurant buyout required. Partial buyouts available in the skylight area.

CHEF VIKAS: Often present but availability varies due to scheduling and travel commitments.

JAIN FOOD: Appetizers: Purple Sweet Potato Chaat, Banarsi Puri, Stuffed Achari Paneer. Mains: Paneer Butter Masala, Roasted Pineapple, Stuffed Okra. Sides: Steamed Rice, Farmer Sattu Roti, Plain Roti.

VEGETARIAN PRIX FIXE: Appetizers: Sweet Potato Chaat, Banarasi Puri, Yogurt Kebab. Mains: Paneer Lazeez, Roasted Pineapple, Stuffed Okra. Additional swaps available from the full menu on the website.

CORKAGE FEE: $50 per 750ml bottle, maximum 2 bottles.

CHILDREN: Welcome but Bungalow is an adult, refined dining environment. No strollers or high chairs. Gets very loud with music. Child included in total guest count.

GIFT CARDS: Available at bungalowny.com. Does not guarantee a reservation.

BUYOUT: $65,000 + taxes + 20% gratuity + 5% admin fee. 6-9pm, 3 hours. Room rental $20,000 included. Premium open bar, family-style menu with 6 appetizers, 6 entrees, 3 classics, 3 breads, 3 desserts.

INVOICE SENT: Invoice sent via POS system, valid 48 hours. Ask for mobile number to finalize.

SISTER RESTAURANT: If we cannot help, suggest GUPSHUP at 212-518-7313.

TONE GUIDELINES:
- Always open with: "Thank you for your email and for thinking of dining with us at Bungalow."
- Be warm but confident and direct. Do not be overly apologetic.
- When there is no availability or it is a small party email request, redirect clearly: suggest Resy, mention walk-ins before 4:30 PM, and suggest GUPSHUP if needed.
- Sign off as: The Bungalow Team
- Do not invent pricing, availability, or details not listed above.`;

let accessToken = null;
let tokenExpiry = 0;
let selected = null;

async function getToken() {
  if (accessToken && Date.now() < tokenExpiry - 60000) return accessToken;
  const res = await fetch('/api/token', { method: 'POST' });
  const data = await res.json();
  if (!data.access_token) throw new Error('Token refresh failed');
  accessToken = data.access_token;
  tokenExpiry = Date.now() + data.expires_in * 1000;
  return accessToken;
}

async function loadEmails() {
  const listEl = document.getElementById('emailList');
  listEl.innerHTML = '<div class="loading-msg">Loading inbox...</div>';
  try {
    const token = await getToken();
    const res = await fetch('/api/emails', { headers: { Authorization: 'Bearer ' + token } });
    const data = await res.json();
    if (!data.messages?.length) { listEl.innerHTML = '<div class="loading-msg" style="color:#bbb">No emails found</div>'; return; }
    document.getElementById('dot').className = 'dot connected';
    document.getElementById('statusLabel').textContent = 'info@bungalowny.com';
    const emails = await Promise.all(data.messages.slice(0, 15).map(m => fetchDetail(m.id, token)));
    renderList(emails.filter(Boolean));
  } catch(e) {
    listEl.innerHTML = `<div class="err" style="margin:12px">${e.message}</div>`;
    document.getElementById('statusLabel').textContent = 'Error';
  }
}

async function fetchDetail(id, token) {
  try {
    const res = await fetch(`/api/emails?path=${id}`, { headers: { Authorization: 'Bearer ' + token } });
    const msg = await res.json();
    const h = msg.payload.headers;
    const from = h.find(x => x.name==='From')?.value || '';
    const subject = h.find(x => x.name==='Subject')?.value || '(no subject)';
    const date = h.find(x => x.name==='Date')?.value || '';
    let body = '';
    if (msg.payload.body?.data) body = b64(msg.payload.body.data);
    else if (msg.payload.parts) {
      const tp = msg.payload.parts.find(p => p.mimeType==='text/plain');
      if (tp?.body?.data) body = b64(tp.body.data);
      else {
        const hp = msg.payload.parts.find(p => p.mimeType==='text/html');
        if (hp?.body?.data) { const d=document.createElement('div'); d.innerHTML=b64(hp.body.data); body=d.innerText; }
      }
    }
    const d = new Date(date);
    const t = d.toLocaleDateString()===new Date().toLocaleDateString() ? d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : d.toLocaleDateString([],{month:'short',day:'numeric'});
    const name = from.match(/^([^<]+)</)?.[1]?.trim() || from.replace(/<.*>/,'').trim();
    return { id, from: name||from, fromFull: from, subject, time: t, body: body.trim().slice(0,1500) };
  } catch(e) { return null; }
}

function b64(d) { try { return decodeURIComponent(escape(atob(d.replace(/-/g,'+').replace(/_/g,'/')))); } catch(e) { return atob(d.replace(/-/g,'+').replace(/_/g,'/')); } }

function renderList(emails) {
  const el = document.getElementById('emailList');
  el.innerHTML = '';
  emails.forEach((email, i) => {
    const div = document.createElement('div');
    div.className = 'email-item';
    div.innerHTML = `<div class="email-sender">${i<3?'<span class="unread-dot"></span>':''}${x(email.from)}</div><div class="email-subject">${x(email.subject)}</div><div class="email-preview">${x(email.body.slice(0,70))}...</div>`;
    div.onclick = () => { document.querySelectorAll('.email-item').forEach(e=>e.classList.remove('active')); div.classList.add('active'); show(email); };
    el.appendChild(div);
  });
}

function x(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function show(email) {
  selected = email;
  document.getElementById('main').innerHTML = `
    <div class="email-card">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px"><div class="email-from">${x(email.fromFull||email.from)}</div><div class="email-time">${x(email.time)}</div></div>
      <div class="email-subject-lg">${x(email.subject)}</div>
      <div class="email-body">${x(email.body)}</div>
    </div>
    <button class="gen-btn" id="genBtn" onclick="generate()">✦ Generate draft reply</button>
    <div id="draftArea"></div>`;
}

async function generate() {
  if (!selected) return;
  const btn = document.getElementById('genBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Generating...';
  document.getElementById('draftArea').innerHTML = '';
  try {
    const res = await fetch('/api/draft', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: [{ role: 'user', content: `Draft a reply:\n\nFrom: ${selected.fromFull||selected.from}\nSubject: ${selected.subject}\n\n${selected.body}` }]
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
    const draft = data.content?.[0]?.text || 'Could not generate.';
    document.getElementById('draftArea').innerHTML = `
      <div class="draft-card">
        <div class="draft-top">
          <div class="draft-lbl">✦ Draft reply<span class="draft-badge">Review before sending</span></div>
          <div class="btn-row"><button class="sm-btn" onclick="copyDraft()">Copy</button><button class="sm-btn" onclick="generate()">Regenerate</button></div>
        </div>
        <div class="draft-text" id="draftContent" contenteditable="true">${x(draft)}</div>
      </div>`;
  } catch(e) {
    document.getElementById('draftArea').innerHTML = `<div class="err">Error: ${e.message}</div>`;
  }
  btn.disabled = false; btn.innerHTML = '✦ Generate new draft';
}

function copyDraft() {
  const el = document.getElementById('draftContent');
  if (!el) return;
  navigator.clipboard.writeText(el.innerText).then(() => { const t=document.getElementById('toast'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); });
}

loadEmails();
</script>
</body>
</html>
