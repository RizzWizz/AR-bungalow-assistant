<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bungalow Draft Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F5FCF8; min-height: 100vh; color: #1a1a1a; }

  .header { background: #0C3D2E; padding: 0 24px; height: 52px; display: flex; align-items: center; gap: 12px; }
  .header-logo { font-size: 19px; color: #B8E8C8; font-style: italic; font-weight: 700; letter-spacing: 0.02em; }
  .header-sub { font-size: 13px; color: #5a9a7a; }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #7DC4A0; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #3d7a5a; }
  .dot.on { background: #6dbf8a; }
  .refresh-btn { padding: 5px 14px; border: 1px solid #1f6a48; border-radius: 20px; background: transparent; color: #B8E8C8; font-size: 12px; cursor: pointer; transition: background 0.15s; }
  .refresh-btn:hover { background: #1a5a3a; }

  .app { display: flex; height: calc(100vh - 52px); }

  .sidebar { width: 280px; background: #EFF8F3; border-right: 0.5px solid #C5E8D5; display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-label { padding: 12px 16px 8px; font-size: 10px; font-weight: 700; color: #5a9a7a; text-transform: uppercase; letter-spacing: 0.1em; border-bottom: 0.5px solid #C5E8D5; }
  .email-list { flex: 1; overflow-y: auto; }
  .email-list::-webkit-scrollbar { width: 3px; }
  .email-list::-webkit-scrollbar-thumb { background: #C5E8D5; border-radius: 2px; }
  .email-item { padding: 11px 16px; border-bottom: 0.5px solid #ddf0e5; cursor: pointer; transition: background 0.1s; }
  .email-item:hover { background: #E5F5EC; }
  .email-item.active { background: #fff; border-left: 3px solid #0C3D2E; }
  .email-sender { font-size: 13px; font-weight: 600; color: #1a1a1a; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
  .email-subject { font-size: 12px; color: #3a6a50; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
  .email-preview { font-size: 11px; color: #8ab8a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .unread-dot { width: 6px; height: 6px; border-radius: 50%; background: #0C3D2E; flex-shrink: 0; }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .main-content { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .main-content::-webkit-scrollbar { width: 4px; }
  .main-content::-webkit-scrollbar-thumb { background: #C5E8D5; border-radius: 2px; }

  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #8ab8a0; gap: 10px; }
  .empty p { font-size: 14px; }

  /* Thread subject header */
  .thread-subject { font-size: 18px; font-weight: 600; color: #0C3D2E; margin-bottom: 16px; line-height: 1.3; }

  /* Gmail-style thread messages */
  .thread-msg { background: #fff; border: 0.5px solid #C5E8D5; border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
  .thread-msg.collapsed { cursor: pointer; }
  .thread-msg.collapsed:hover { background: #f8fdf9; }
  .thread-msg-header { padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .avatar.guest { background: #E5F5EC; color: #0C3D2E; }
  .avatar.bungalow { background: #0C3D2E; color: #B8E8C8; }
  .msg-meta { flex: 1; min-width: 0; }
  .msg-from { font-size: 13px; font-weight: 600; color: #1a1a1a; }
  .msg-from.bungalow-name { color: #0C3D2E; }
  .msg-time { font-size: 11px; color: #8ab8a0; margin-left: auto; flex-shrink: 0; }
  .msg-preview { font-size: 12px; color: #8ab8a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .msg-body { padding: 0 16px 14px 58px; font-size: 13px; color: #2a2a2a; line-height: 1.7; white-space: pre-wrap; border-top: 0.5px solid #E5F5EC; padding-top: 10px; }

  /* Latest message — expanded by default, more prominent */
  .thread-msg.latest { border-color: #0C3D2E; }
  .thread-msg.latest .thread-msg-header { background: #f0faf4; }

  /* Generate button */
  .gen-btn { padding: 12px; background: #0C3D2E; color: #B8E8C8; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 12px; transition: background 0.15s; letter-spacing: 0.01em; }
  .gen-btn:hover { background: #0f4f3a; }
  .gen-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Draft */
  .draft-card { background: #fff; border: 0.5px solid #C5E8D5; border-radius: 10px; overflow: hidden; margin-top: 12px; }
  .draft-top { padding: 11px 16px; border-bottom: 0.5px solid #E5F5EC; display: flex; align-items: center; justify-content: space-between; background: #f0faf4; }
  .draft-lbl { font-size: 11px; font-weight: 700; color: #0C3D2E; text-transform: uppercase; letter-spacing: 0.08em; }
  .draft-badge { background: #E5F5EC; color: #3a8a5a; font-size: 10px; padding: 2px 8px; border-radius: 20px; margin-left: 8px; font-weight: 600; }
  .btn-row { display: flex; gap: 8px; }
  .sm-btn { padding: 5px 12px; border: 0.5px solid #C5E8D5; border-radius: 20px; background: white; color: #3a6a50; font-size: 12px; cursor: pointer; transition: all 0.1s; }
  .sm-btn:hover { background: #E5F5EC; }
  .draft-text { padding: 16px; font-size: 13px; color: #1a1a1a; line-height: 1.75; white-space: pre-wrap; outline: none; min-height: 160px; }
  .draft-text:focus { background: #fafffe; }

  .no-reply { padding: 16px; font-size: 13px; color: #5a9a7a; font-style: italic; text-align: center; }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(184,232,200,0.3); border-top-color: #B8E8C8; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { position: fixed; bottom: 24px; right: 24px; background: #0C3D2E; color: #B8E8C8; padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .err { color: #c0392b; font-size: 13px; padding: 12px; background: #fdf0f0; border-radius: 8px; border: 0.5px solid #f5c6c6; margin-top: 8px; }
  .loading-msg { padding: 20px 16px; font-size: 12px; color: #8ab8a0; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="header-logo">Bungalow</div>
  <div class="header-sub">Draft Assistant</div>
  <div class="header-right">
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusLabel">Connecting...</span>
    </div>
    <button class="refresh-btn" onclick="loadEmails()">↻ Refresh</button>
  </div>
</div>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-label">info@bungalowny.com</div>
    <div class="email-list" id="emailList">
      <div class="loading-msg">Loading inbox...</div>
    </div>
  </div>
  <div class="main">
    <div class="main-content" id="main">
      <div class="empty"><p>Select an email to view the thread and generate a draft</p></div>
    </div>
  </div>
</div>
<div class="toast" id="toast">Copied to clipboard</div>

<script>
const SYSTEM_PROMPT = `You are an email assistant for Bungalow, a refined Indian restaurant in NYC by Chef Vikas Khanna. Draft professional, warm, and confident replies to guest emails.

CRITICAL RULES:
- Read the FULL conversation thread carefully before drafting.
- Do not ask for information already provided in the thread.
- If the latest message is just a thank you, noted, ok, or a simple acknowledgment with no question or action needed, respond with ONLY: NO_REPLY_NEEDED
- Keep replies concise. 2-3 sentences for simple requests.
- Never repeat Resy instructions if they have already been given in the same thread.
- Do not use markdown formatting like bold or bullet points.
- Do not open with "I hope this email finds you well" or similar filler.

KEY POLICIES:
RESERVATIONS: All parties under 8 must book exclusively through Resy. Opens 20 days in advance at 11 AM EST, except Tuesdays.
WALK-INS: Welcome before 4:30 PM, we do our best based on availability.
NO AVAILABILITY: Redirect to Resy and mention walk-ins before 4:30 PM. Suggest GUPSHUP at 212-518-7313. Do not be overly apologetic.
LARGE PARTIES 8-18: Prix fixe menu family style. $25 per person non-refundable deposit. Confirm headcount, menu, and payment to lock in. Invoice valid 48 hours. No strollers or high chairs.
OVER 18: Full buyout required. Partial buyouts in skylight area.
CHEF VIKAS: Often present but varies due to scheduling and travel.
JAIN FOOD: Apps: Purple Sweet Potato Chaat, Banarsi Puri, Stuffed Achari Paneer. Mains: Paneer Butter Masala, Roasted Pineapple, Stuffed Okra. Sides: Steamed Rice, Farmer Sattu Roti, Plain Roti.
CORKAGE: $50 per 750ml, max 2 bottles.
CHILDREN: Welcome but adult environment. No strollers or high chairs. Child in guest count.
GIFT CARDS: bungalowny.com. Does not guarantee reservation.
BUYOUT: $65,000 + taxes + 20% gratuity + 5% admin. 6-9pm. Room $20,000 included.
LUNCH: Dinner only, no lunch service.

Open with: "Thank you for your email and for thinking of dining with us at Bungalow."
Sign off: The Bungalow Team
Never invent pricing or details.`;

let accessToken = null;
let tokenExpiry = 0;
let selected = null;

async function getToken() {
  if (accessToken && Date.now() < tokenExpiry - 60000) return accessToken;
  const res = await fetch('/api/token', { method: 'POST' });
  const data = await res.json();
  if (!data.access_token) throw new Error('Token refresh failed');
  accessToken = data.access_token;
  tokenExpiry = Date.now() + data.expires_in * 1000;
  return accessToken;
}

async function loadEmails() {
  const listEl = document.getElementById('emailList');
  listEl.innerHTML = '<div class="loading-msg">Loading inbox...</div>';
  try {
    const token = await getToken();
    const res = await fetch('/api/emails', { headers: { Authorization: 'Bearer ' + token } });
    const data = await res.json();
    if (!data.messages?.length) { listEl.innerHTML = '<div class="loading-msg">No emails found</div>'; return; }
    document.getElementById('dot').className = 'dot on';
    document.getElementById('statusLabel').textContent = 'info@bungalowny.com';
    const emails = await Promise.all(data.messages.slice(0, 15).map(m => fetchDetail(m.id, token)));
    renderList(emails.filter(Boolean));
  } catch(e) {
    listEl.innerHTML = `<div class="err" style="margin:12px">${e.message}</div>`;
  }
}

async function fetchDetail(id, token) {
  try {
    const res = await fetch(`/api/emails?path=${id}`, { headers: { Authorization: 'Bearer ' + token } });
    const msg = await res.json();
    const h = msg.payload.headers;
    const from = h.find(x => x.name==='From')?.value || '';
    const subject = h.find(x => x.name==='Subject')?.value || '(no subject)';
    const date = h.find(x => x.name==='Date')?.value || '';
    const body = extractBody(msg.payload);
    const d = new Date(date);
    const t = d.toLocaleDateString()===new Date().toLocaleDateString()
      ? d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})
      : d.toLocaleDateString([],{month:'short',day:'numeric'});
    const name = from.match(/^"?([^"<]+)"?\s*</)?.[1]?.trim() || from.replace(/<.*>/,'').trim();
    return { id, from: name||from, fromFull: from, subject, time: t, body: body.trim().slice(0,4000) };
  } catch(e) { return null; }
}

function extractBody(payload) {
  if (payload.body?.data) return b64(payload.body.data);
  if (payload.parts) {
    for (const part of payload.parts) {
      if (part.mimeType==='text/plain' && part.body?.data) return b64(part.body.data);
      if (part.parts) { const s = extractBody(part); if (s) return s; }
    }
    for (const part of payload.parts) {
      if (part.mimeType==='text/html' && part.body?.data) {
        const d = document.createElement('div'); d.innerHTML = b64(part.body.data); return d.innerText;
      }
    }
  }
  return '';
}

function b64(d) {
  try { return decodeURIComponent(escape(atob(d.replace(/-/g,'+').replace(/_/g,'/')))); }
  catch(e) { return atob(d.replace(/-/g,'+').replace(/_/g,'/')); }
}

function x(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function initials(name) {
  return name.split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || '?';
}

function isBungalowSender(from) {
  return from.toLowerCase().includes('bungalow') || from.toLowerCase().includes('info@');
}

function renderList(emails) {
  const el = document.getElementById('emailList');
  el.innerHTML = '';
  emails.forEach((email, i) => {
    const div = document.createElement('div');
    div.className = 'email-item';
    div.innerHTML = `
      <div class="email-sender">${i<3?'<span class="unread-dot"></span>':''}${x(email.from)}</div>
      <div class="email-subject">${x(email.subject)}</div>
      <div class="email-preview">${x(email.body.slice(0,60))}...</div>`;
    div.onclick = () => {
      document.querySelectorAll('.email-item').forEach(e=>e.classList.remove('active'));
      div.classList.add('active');
      show(email);
    };
    el.appendChild(div);
  });
}

function parseThreadMessages(body) {
  const lines = body.split('\n');
  const messages = [];
  let current = [];
  let inQuoted = false;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if ((line.startsWith('On ') && line.includes('wrote:')) ||
        (line.startsWith('------') && line.includes('Original'))) {
      if (current.length) {
        messages.unshift({ text: current.join('\n').trim(), isQuote: false });
        current = [];
      }
      inQuoted = true;
    } else if (inQuoted && line.startsWith('>')) {
      current.push(line.replace(/^>+\s?/, ''));
    } else if (!inQuoted) {
      if (!line.includes('[Quoted text hidden]')) current.push(line);
    }
  }
  if (current.length) {
    if (inQuoted) messages.push({ text: current.join('\n').trim(), isQuote: true });
    else messages.unshift({ text: current.join('\n').trim(), isQuote: false });
  }
  return messages.filter(m => m.text.trim().length > 5);
}

function show(email) {
  selected = email;
  const isBung = isBungalowSender(email.fromFull);
  const threadMsgs = parseThreadMessages(email.body);
  const senderName = email.from;
  const cleanSubject = email.subject.replace(/^(Re:|Fwd?:)\s*/i, '').trim();

  let threadHTML = '';

  if (threadMsgs.length > 1) {
    threadMsgs.slice(1).reverse().forEach((msg, idx) => {
      const isB = idx % 2 === (isBung ? 1 : 0);
      const name = isB ? 'Bungalow' : senderName;
      const av = isB ? 'bungalow' : 'guest';
      const preview = msg.text.slice(0,80).replace(/\n/g,' ');
      threadHTML += `
        <div class="thread-msg collapsed" onclick="toggleMsg(this)">
          <div class="thread-msg-header">
            <div class="avatar ${av}">${isB ? 'BW' : initials(name)}</div>
            <div class="msg-meta">
              <div class="msg-from ${isB?'bungalow-name':''}">${x(name)}</div>
              <div class="msg-preview">${x(preview)}...</div>
            </div>
          </div>
          <div class="msg-body" style="display:none">${x(msg.text)}</div>
        </div>`;
    });
  }

  const latestText = threadMsgs[0]?.text || email.body.slice(0,1200);
  const latestClean = latestText.replace(/\[Quoted text hidden\]/g,'').trim();

  threadHTML += `
    <div class="thread-msg latest">
      <div class="thread-msg-header">
        <div class="avatar ${isBung?'bungalow':'guest'}">${isBung ? 'BW' : initials(senderName)}</div>
        <div class="msg-meta">
          <div class="msg-from ${isBung?'bungalow-name':''}">${x(email.from)}</div>
        </div>
        <div class="msg-time">${x(email.time)}</div>
      </div>
      <div class="msg-body">${x(latestClean)}</div>
    </div>`;

  document.getElementById('main').innerHTML = `
    <div class="thread-subject">${x(cleanSubject)}</div>
    ${threadHTML}
    <button class="gen-btn" id="genBtn" onclick="generate()">✦ Generate draft reply</button>
    <div id="draftArea"></div>`;
}

function toggleMsg(el) {
  const body = el.querySelector('.msg-body');
  const preview = el.querySelector('.msg-preview');
  if (body.style.display === 'none') {
    body.style.display = 'block';
    if (preview) preview.style.display = 'none';
    el.classList.remove('collapsed');
  } else {
    body.style.display = 'none';
    if (preview) preview.style.display = 'block';
    el.classList.add('collapsed');
  }
}

async function generate() {
  if (!selected) return;
  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Generating...';
  document.getElementById('draftArea').innerHTML = '';
  try {
    const res = await fetch('/api/draft', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 800,
        system: SYSTEM_PROMPT,
        messages: [{ role: 'user', content: `Full email thread:\n\nSubject: ${selected.subject}\n\n${selected.body}\n\nDraft a reply to the most recent guest message.` }]
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
    const draft = data.content?.[0]?.text || 'Could not generate.';

    if (draft.trim() === 'NO_REPLY_NEEDED') {
      document.getElementById('draftArea').innerHTML = `
        <div class="draft-card">
          <div class="draft-top"><div class="draft-lbl">No reply needed</div></div>
          <div class="no-reply">This is a closing message — no response required.</div>
        </div>`;
    } else {
      document.getElementById('draftArea').innerHTML = `
        <div class="draft-card">
          <div class="draft-top">
            <div class="draft-lbl">Draft reply<span class="draft-badge">Review before sending</span></div>
            <div class="btn-row">
              <button class="sm-btn" onclick="copyDraft()">Copy</button>
              <button class="sm-btn" onclick="generate()">Regenerate</button>
            </div>
          </div>
          <div class="draft-text" id="draftContent" contenteditable="true">${x(draft)}</div>
        </div>`;
    }
  } catch(e) {
    document.getElementById('draftArea').innerHTML = `<div class="err">Error: ${e.message}</div>`;
  }
  btn.disabled = false;
  btn.innerHTML = '✦ Generate draft reply';
}

function copyDraft() {
  const el = document.getElementById('draftContent');
  if (!el) return;
  navigator.clipboard.writeText(el.innerText).then(() => {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  });
}

loadEmails();
</script>
</body>
</html>
